global:
  environment: example-env
  ecr_repository: HYPERSPACE_ACCOUNT_ID.dkr.ecr.eu-central-1.amazonaws.com

data-node:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  config:
    log_level: DEBUG
    restore: true
    restore_doc_values: true
    save_backup: true
    load_at_timeout: true
    save_backup_s3: false
    restore_from_rocksdb: false
    query_timeout: 10000
  ebsVolume:
    enabled: true
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/<PROJECT>-<ENVIRONMENT>-EC2TagsPolicy # Replace with the correct role ARN
  hugePages:
    enabled: true
    numOfHugePages: 1
    reduceOsHugePages: true

realtime-compiler:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  config:
    log_level: DEBUG

search-master:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  config:
    log_level: DEBUG
    restore: false
    commit_timeout: 120000
  fulldomainname: internal.hyperspace.example-env.<DomainName>
  
scoring:
  replicaCount: 0

etcd:
  fullnameOverride: etcd-env-1

backup:
  daily:
    enabled: false
  hourly:
    enabled: false