apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: env-1
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/<ORG>/<REPO>.git
    targetRevision: master
    path: argocd/envs/env-1