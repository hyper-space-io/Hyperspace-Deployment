apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-env
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: example-env
  source:
    repoURL: https://github.com/hyper-space-io/Hyperspace-Deployment-Private.git
    targetRevision: simulation
    path: argocd/envs/example-env